<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Business Result Card</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet"/>
</head>
<body>

  <div class="card">

    <div class="left-panel">
      <p class="result-label">Your Result</p>

      <div class="score-circle">
        <span class="score-number">76</span>
        <span class="score-total">of 100</span>
      </div>

      <h2 class="grade">Great</h2>
      <p class="result-description">
        You scored higher than 65% of the people who have taken these tests.
      </p>
    </div>

    <div class="right-panel">
      <h3 class="summary-title">Summary</h3>

      <ul class="summary-list">
        <li class="summary-item reaction">
          <div class="item-label">
            <span class="icon">⚡</span>
            <span class="category">Reaction</span>
          </div>
          <div class="item-score">
            <span class="score-value">80</span>
            <span class="score-max">/ 100</span>
          </div>
        </li>

        <li class="summary-item memory">
          <div class="item-label">
            <span class="icon">🧠</span>
            <span class="category">Memory</span>
          </div>
          <div class="item-score">
            <span class="score-value">92</span>
            <span class="score-max">/ 100</span>
          </div>
        </li>

        <li class="summary-item verbal">
          <div class="item-label">
            <span class="icon">💬</span>
            <span class="category">Verbal</span>
          </div>
          <div class="item-score">
            <span class="score-value">61</span>
            <span class="score-max">/ 100</span>
          </div>
        </li>

        <li class="summary-item visual">
          <div class="item-label">
            <span class="icon">👁️</span>
            <span class="category">Visual</span>
          </div>
          <div class="item-score">
            <span class="score-value">73</span>
            <span class="score-max">/ 100</span>
          </div>
        </li>
      </ul>

      <button class="continue-btn">Continue</button>
    </div>

  </div>

</body>
</html>
